[package]
name = "avio-editor-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
avio = { version = "0.17", features = ["preview", "serde"] }
# avio 0.17 (ADR-0004) removed the primitive re-exports; ff-* primitives are now imported directly.
ff-preview = { version = "0.17", features = ["proxy"] } # PreviewPlayer, RgbaFrame, FrameSink, ProxyGenerator, ProxyResolution
ff-encode = { version = "0.17", features = ["preview-image"] } # GifPreview, SpriteSheet
ff-decode = { version = "0.17" }                              # ThumbnailSelector
ff-filter = { version = "0.17" }                              # LoudnessMeter
ff-remux = { version = "0.17" }                               # StreamCopyTrim

eframe     = "0.33"
egui       = "0.33"
rfd        = "0.17.2"
tokio      = { version = "1.51.1", features = ["full"] }
log        = "0.4.29"
env_logger = "0.11.10"
image      = { version = "0.25.10", default-features = false, features = ["png"] }
serde      = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
cpal       = "0.15"

[patch.crates-io]
avio        = { path = "../avio/crates/avio" }
ff-preview  = { path = "../avio/crates/ff-preview" }
ff-pipeline = { path = "../avio/crates/ff-pipeline" }
ff-filter   = { path = "../avio/crates/ff-filter" }
ff-decode   = { path = "../avio/crates/ff-decode" }
ff-encode   = { path = "../avio/crates/ff-encode" }
ff-format   = { path = "../avio/crates/ff-format" }
ff-probe    = { path = "../avio/crates/ff-probe" }
ff-sys      = { path = "../avio/crates/ff-sys" }
ff-common   = { path = "../avio/crates/ff-common" }
ff-remux    = { path = "../avio/crates/ff-remux" }
